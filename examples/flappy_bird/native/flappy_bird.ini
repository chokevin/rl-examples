[base]
env_name = flappy_bird
checkpoint_dir = experiments/native_checkpoints
log_dir = experiments/native_logs
checkpoint_interval = 25
eval_episodes = 32

[vec]
total_agents = 32
num_buffers = 1
num_threads = 1

[policy]
hidden_size = 128
num_layers = 1
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[env]
screen_width = 800
screen_height = 450
gravity = 0.35
flap_velocity = -6.5
bird_x = 160.0
bird_radius = 14.0
pipe_width = 70.0
pipe_gap = 220.0
pipe_speed = 2.6
pipe_spacing = 260.0
pipe_count = 3
alive_reward = 0.01
pass_reward = 1.0
crash_reward = -1.0
max_steps = 1800
reward_shaping = 1
centering_reward = 0.05
seed = 1

[train]
total_timesteps = 200_000
learning_rate = 0.001
optimizer = Adam
initial_flap_logit_bias = -2.0
gamma = 0.99
gae_lambda = 0.95
minibatch_size = 2048
horizon = 64
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.001
prio_alpha = 0.8
prio_beta0 = 0.2
